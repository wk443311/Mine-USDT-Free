<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ad Unlock System</title>
  
  <!-- ✅ OFFICIAL AdsGram SDK - MUST BE IN <head> -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #ad-counter {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 24px;
      padding: 10px 20px;
      background: rgba(255,255,255,0.95);
      border-radius: 25px;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      color: #555;
    }
    .ad-container {
      background: #fff;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.25);
      max-width: 450px;
      width: 100%;
      animation: slideUp 0.4s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ad-container h2 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: #2d3748;
    }
    .ad-container p {
      color: #718096;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      padding: 14px 28px;
      margin: 10px 5px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s;
      width: 100%;
      max-width: 300px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
    .btn-success { background: linear-gradient(135deg, #28a745, #20c997); color: white; display: none; }
    .btn-warning { background: linear-gradient(135deg, #ffc107, #fd7e14); color: #212529; display: none; }
    .hidden { display: none !important; }
    #ad-status {
      margin-top: 16px;
      font-weight: 500;
      min-height: 24px;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .error { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }
    .success { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; }
    .timer-badge {
      display: inline-block;
      background: #edf2f7;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 8px;
      color: #4a5568;
    }
    
    /* ✅ Custom Warning Modal - NO URL SHOWN */
    .warning-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.3s ease;
    }
    .warning-modal.show { display: flex; }
    .warning-content {
      background: #fff;
      padding: 32px 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: slideDown 0.3s ease;
    }
    .warning-icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .warning-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #c53030;
      margin-bottom: 12px;
    }
    .warning-message {
      color: #4a5568;
      margin-bottom: 24px;
      line-height: 1.5;
      white-space: pre-line;
    }
    .warning-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .warning-btn:hover { transform: translateY(-2px); }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ✅ Custom Warning Modal (No URL Shown) -->
  <div class="warning-modal" id="warningModal">
    <div class="warning-content">
      <div class="warning-icon">⚠️</div>
      <div class="warning-title">Ad Warning</div>
      <div class="warning-message" id="warningMessage"></div>
      <button class="warning-btn" onclick="closeWarning()">OK</button>
    </div>
  </div>

  <!-- ✅ Requested Counter at Top -->
  <div id="ad-counter">ads watching 5/1</div>

  <div class="ad-container" id="ad-wall">
    <h2>🔒 Content Locked!</h2>
    <p>Please watch the ad below to unlock this content.</p>

    <button class="btn btn-primary" id="watch-ad-btn">🔓 Watch Ad to Unlock</button>
    
    <div id="loading-ad" class="hidden">
      <div style="margin: 20px 0;">
        <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
      </div>
      Loading Advertisement...
      <div class="timer-badge">⏱️ Min watch: 9 seconds</div>
    </div>
    
    <button class="btn btn-warning" id="close-ad-btn">✖ Close Ad & Unlock</button>
    <button class="btn btn-success" id="unlocked-btn">✅ Successfully Unlocked!</button>
    
    <div id="ad-status"></div>
  </div>

  <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

  <script>
    // ================= CONFIGURATION =================
    const BLOCK_ID = "int-32894";           // ✅ Your AdsGram Block ID
    const YOUTUBE_URL = "https://youtube.com"; // 🎯 Redirect URL (change as needed)
    const MIN_WATCH_SEC = 9;                // ⚠️ Minimum watch time to unlock
    const AUTO_REDIRECT_SEC = 15;           // 🔄 Auto-redirect fallback timer
    // ===============================================

    // DOM Elements
    const watchAdBtn = document.getElementById('watch-ad-btn');
    const loadingAd = document.getElementById('loading-ad');
    const closeAdBtn = document.getElementById('close-ad-btn');
    const unlockedBtn = document.getElementById('unlocked-btn');
    const adStatus = document.getElementById('ad-status');
    const adCounter = document.getElementById('ad-counter');
    const warningModal = document.getElementById('warningModal');
    const warningMessage = document.getElementById('warningMessage');

    let adWatched = false;
    let AdController = null;
    let adStartTime = null;
    let autoRedirectTimer = null;

    // ✅ Custom Warning Modal - NO URL SHOWN
    function triggerAdWarning(message) {
      adStatus.textContent = message;
      adStatus.className = 'error';
      
      // 🚨 Show custom modal instead of browser alert (no URL shown)
      warningMessage.textContent = message;
      warningModal.classList.add('show');
      
      console.warn("[AdsGram] Warning:", message);
    }

    // ✅ Close warning modal
    function closeWarning() {
      warningModal.classList.remove('show');
    }

    // Close modal on outside click
    warningModal.addEventListener('click', (e) => {
      if (e.target === warningModal) {
        closeWarning();
      }
    });

    // ✅ OFFICIAL AdsGram Reward Interstitial Integration
    function showAdsGramAd() {
      if (adWatched) return;

      try {
        // Initialize AdsGram with YOUR block ID
        AdController = window.Adsgram.init({ blockId: BLOCK_ID });
      } catch (initError) {
        triggerAdWarning("AdsGram initialization failed: " + initError.message);
        return;
      }

      watchAdBtn.classList.add('hidden');
      loadingAd.classList.remove('hidden');
      adStatus.textContent = '';
      adStatus.className = '';
      
      // 🎯 Record ad start time for duration check
      adStartTime = Date.now();
      
      // 🔄 Auto-redirect timer (15 seconds fallback)
      autoRedirectTimer = setTimeout(() => {
        if (!adWatched) {
          adWatched = true;
          adStatus.textContent = "⏱️ Time's up! Redirecting...";
          adStatus.className = 'success';
          setTimeout(() => {
            window.location.href = YOUTUBE_URL;
          }, 500);
        }
      }, AUTO_REDIRECT_SEC * 1000);

      // 🎯 Official AdsGram show() method
      AdController.show()
        .then((result) => {
          // ✅ Clear fallback timer
          clearTimeout(autoRedirectTimer);
          
          const watchDuration = (Date.now() - adStartTime) / 1000; // seconds
          console.log("[AdsGram] Ad watched for:", watchDuration.toFixed(1) + "s");

          // ⚠️ CHECK: Did user watch at least MIN_WATCH_SEC?
          if (watchDuration < MIN_WATCH_SEC) {
            // ❌ Closed too early - show warning, DON'T unlock, DON'T redirect
            loadingAd.classList.add('hidden');
            watchAdBtn.classList.remove('hidden');
            triggerAdWarning(`⚠️ Ad closed too early!\nPlease watch at least ${MIN_WATCH_SEC} seconds to unlock.`);
            adStartTime = null;
            return;
          }

          // ✅ Valid watch - unlock & redirect to YouTube
          loadingAd.classList.add('hidden');
          adWatched = true;
          adStatus.textContent = "✅ Ad completed! Redirecting...";
          adStatus.className = 'success';
          adCounter.textContent = "ads watching 5/1 - ✅ Redirecting";
          
          // 🎯 Redirect to YouTube after small delay
          setTimeout(() => {
            window.location.href = YOUTUBE_URL;
          }, 800);
        })
        .catch((error) => {
          // ❌ Ad failed to load / no fill / blocked
          clearTimeout(autoRedirectTimer);
          loadingAd.classList.add('hidden');
          watchAdBtn.classList.remove('hidden');
          
          const errorMsg = error?.message || "No ad available or ad failed to load";
          triggerAdWarning(errorMsg);
          adStartTime = null;
          console.error("[AdsGram Error]", error);
        });
    }

    // 🔘 Event Listeners
    watchAdBtn.addEventListener('click', showAdsGramAd);

    closeAdBtn.addEventListener('click', () => {
      if (!adWatched) return;
      
      // If user manually clicks close after valid watch
      clearTimeout(autoRedirectTimer);
      adWatched = true;
      closeAdBtn.classList.add('hidden');
      unlockedBtn.classList.remove('hidden');
      adStatus.textContent = "🎉 Content unlocked!";
      adStatus.className = 'success';
      adCounter.textContent = "ads watching 5/1 - ✅ Unlocked";
      
      console.log("[AdsGram] Content unlocked manually.");
    });

    // 🔍 Fallback: Check if AdsGram SDK loaded properly
    window.addEventListener('load', () => {
      if (typeof window.Adsgram === 'undefined') {
        console.warn("[AdsGram] SDK not loaded. Check script in <head>.");
        triggerAdWarning("AdsGram SDK failed to load. Please disable ad blockers and refresh.");
      }
    });

    // 🔔 Optional: Request notification permission for better warnings
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
  </script>

</body>
</html>
